[project]
name = "hipo-mcp"
version = "0.2.0"
description = "HiPo Work MCP Server — AI 招聘平台 MCP 接口（OAuth 2.0 认证）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lin Tong", email = "sexylin2010@gmail.com" }]
keywords = ["mcp", "mcp-server", "oauth2", "recruitment", "hiring", "ai-agent", "job-matching", "简历", "招聘"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # P1-19: fastmcp 锁 3.x（部署用 3.4.7，代码依赖 fastmcp.server.auth.auth /
    # fastmcp.server.dependencies 的 3.x API）。跨大版本（4.x+）可能破坏 import → 服务起不来。
    "fastmcp>=3.4.7,<4.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
# P1-16: 配置 HIPO_REDIS_URL 后将 OAuth 状态/限流桶持久化到 Redis（多副本水平扩展）。
redis = ["redis>=5.0.0"]

[project.urls]
homepage = "https://hipowork.com"
repository = "https://github.com/sexylin/hipo-mcp"
"Bug Tracker" = "https://github.com/sexylin/hipo-mcp/issues"

[project.scripts]
hipo-mcp = "hipo_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hipo_mcp*"]